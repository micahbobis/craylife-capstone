{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="panel">
    <h2>Request Password Reset</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        <label>Email</label>
        {{ form.email(class="form-control") }}

        {{ form.submit(class="button") }}
    </form>
</div>
{% endblock %}
