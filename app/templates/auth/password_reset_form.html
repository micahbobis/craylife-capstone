{% extends "base.html" %}

{% block title %}Reset Password - Craylife{% endblock %}

{% block content %}
<div class="login-wrapper">

    <div class="panel login-panel glow">
        <h2 class="text-center">
            <i class="fa-solid fa-unlock-keyhole"></i> Reset Password
        </h2>
        <p class="text-center description">
            Enter your email address below to receive a reset link.
        </p>

        <form method="POST" action="{{ url_for('password_reset') }}" class="reset-form">

            <div class="form-group">
                <label for="email">
                    <i class="fa-solid fa-envelope"></i> Email Address
                </label>
                <input 
                    type="email" 
                    name="email" 
                    class="form-control" 
                    required 
                    autocomplete="email" 
                    placeholder="Enter your email address"
                >
            </div>

            <div class="form-group mt-2">
                <button type="submit" class="button w-100">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="button small">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

</div>
{% endblock %}
